<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pro Unicode ⇄ KrutiDev Converter</title>



<link rel="stylesheet" href="style.css" /></head>


<body>


<div class="container">
  <h1>⚡ Pro Unicode ⇄ KrutiDev Converter</h1>


  <textarea id="inputText" placeholder="Type or paste text..."></textarea>


  <div class="controls">
    <select id="mode">
      <option value="auto">Auto Detect</option>
      <option value="uniToKruti">Unicode → KrutiDev</option>
      <option value="krutiToUni">KrutiDev → Unicode</option>
    </select>


    <button onclick="toggleMode()">🔄 Shift</button>
    <button onclick="copyText()">Copy</button>
    <button onclick="clearText()">Clear</button>
    <button onclick="downloadText()">Download</button>
  </div>


  <div class="stats">
    Words: <span id="wordCount">0</span> |
    Characters: <span id="charCount">0</span>
  </div>


  <textarea id="outputText" class="preview" readonly=""></textarea>


  <div class="footer">Pro Converter | Fast • Smart • Accurate</div>
</div>






<script src="script.js"></script></body></html>
