<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BlueTalk | Voice Over Bluetooth</title>
    
    
    
    <!-- 
        TECHNICAL NOTE: 
        The Web Bluetooth API primarily handles low-energy (BLE) control and doesn't natively support 
        high-bandwidth synchronous audio streaming profiles (like A2DP/HFP). 
        This implementation uses Web Bluetooth for the 'pairing' handshake simulation and 
        WebRTC (MediaDevices API) for real-time voice processing. In a production environment, 
        a signaling server or P2P data channel would be used to bridge the audio between devices.
    -->
    
<link rel="stylesheet" href="style.css" /></head>
<body>

    <div class="container">
        <header class="brand">
            <h1>BlueTalk</h1>
            <p>Smart Voice Interface</p>
        </header>

        <div class="dashboard">
            <div class="status-header">
                <div class="indicator">
                    <span class="led-label">System</span>
                    <div id="led-conn" class="led led-conn disconnected"></div>
                </div>
                <div class="indicator">
                    <span class="led-label">Channel</span>
                    <div id="led-mode" class="led led-mode"></div>
                </div>
            </div>

            <div id="viz" class="visualizer-container">
                <!-- Visualizer bars generated by JS -->
            </div>

            <div class="modes">
                <button id="btn-tx" class="mode-btn" onclick="setMode('transmitter')">
                    <span>🎙️</span>
                    <span>TRANSMITTER</span>
                </button>
                <button id="btn-rx" class="mode-btn" onclick="setMode('receiver')">
                    <span>🔊</span>
                    <span>RECEIVER</span>
                </button>
            </div>

            <div class="audio-settings">
                <div class="setting-group">
                    <div class="setting-label">
                        <span>Audio Profile</span>
                        <span id="active-profile-label">Normal</span>
                    </div>
                    <div class="profile-grid">
                        <label class="profile-option">
                            <input type="radio" name="profile" value="eco" onchange="setAudioProfile(this.value)" />
                            <span class="profile-box">ECO</span>
                        </label>
                        <label class="profile-option">
                            <input type="radio" name="profile" value="bass" onchange="setAudioProfile(this.value)" />
                            <span class="profile-box">BASS</span>
                        </label>
                        <label class="profile-option">
                            <input type="radio" name="profile" value="treble" onchange="setAudioProfile(this.value)" />
                            <span class="profile-box">TREBLE</span>
                        </label>
                        <label class="profile-option">
                            <input type="radio" name="profile" value="dj" onchange="setAudioProfile(this.value)" />
                            <span class="profile-box">DJ</span>
                        </label>
                        <label class="profile-option">
                            <input type="radio" name="profile" value="beat" onchange="setAudioProfile(this.value)" />
                            <span class="profile-box">BEAT</span>
                        </label>
                    </div>
                </div>

                <div class="setting-group">
                    <div class="setting-label">
                        <span>Master Volume</span>
                        <span id="volume-val">80%</span>
                    </div>
                    <div class="volume-container">
                        <input type="range" id="vol-slider" min="0" max="100" value="80" oninput="updateVolume(this.value)" />
                    </div>
                </div>
            </div>

            <div id="conn-panel" class="conn-panel">
                <div class="setting-label">
                    <span>Your ID (Tap to Copy)</span>
                </div>
                <div class="qr-wrapper">
                    <div id="my-id" class="peer-id-box" onclick="copyMyId()">---</div>
                    <div id="qrcode"></div>
                </div>
                
                <div class="setting-label">
                    <span>Connect to Remote Peer</span>
                </div>
                <div class="id-input-group">
                    <input type="text" id="target-id" class="id-input" placeholder="Enter remote ID..." />
                    <button id="btn-scan" class="btn-scan" onclick="startScanner()">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M4 7V4h3M17 4h3v3M20 17v3h-3M7 20H4v-3M7 12h10M12 7v10"/></svg>
                    </button>
                    <button id="btn-pair" class="btn-connect" onclick="pairDevice()">Connect</button>
                </div>
            </div>

            <div id="scanner-modal">
                <div id="reader"></div>
                <div class="scanner-controls">
                    <button class="btn-close-scanner" onclick="stopScanner()">Cancel Scan</button>
                </div>
            </div>

            <div class="controls">
                <button id="btn-talk" class="main-btn btn-talk" disabled="" onclick="toggleTalk()">
                    <span id="talk-icon">▶</span>
                    <span id="talk-label">Start Talk</span>
                </button>
            </div>

            <div id="status-msg" class="status-text">Ready to connect...</div>
        </div>
    </div>

    


<script src="script.js"></script></body></html>
